<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <style>
            .row {
                display: flex;
                gap: 4px 10px;
                flex-wrap: wrap;
                align-items: flex-start;
            }
            .row > div {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
            }
            .row .desc {
                visibility: hidden;
            }
            .row button:hover + .desc {
                visibility: visible;
            }
            .row .desc:hover {
                visibility: visible;
            }

            button {
                background: white;
                border: 1px solid #999;
                cursor: pointer;
            }

            .row button.phoneme {
                border: 2px solid #999;
                min-width: 60px;
                height: 60px;
                padding: 8px;
                border-radius: 8px;
                font-size: 1.2em;
                font-weight: 700;
                font-family: 'Courier New', monospace;
                display: flex;
                flex-direction: column;
            }

            button.shortcut {
                padding: 5px;
            }

            label {
                font-size: 1.2em;
                margin-left: 30px;
            }

            input {
                font-size: 1.2em;
                font-weight: 700;
                font-family: 'Courier New', monospace; 
                margin: 5px;               
            }

            .desc {
                max-width: 60px;
            }

            .row button.example {
                border: 1px solid #999;
                margin: 2px;
                border-radius: 3px;
            }

            h2 {
                margin: 0;
            }

            table {
                table-layout: fixed;
                width: 50%;
                margin: 10px auto;
                border-collapse: collapse;
                border-top: 1px solid #999999;
                border-bottom: 1px solid #999999;
            }

            th, td {
                padding: 0.6em;
                text-align: center;
            }

            tbody tr:nth-child(odd) {
                background-color: #eeeeee;
            }

            .ipa-reminder {
                font-size: 0.7em;
                margin-top: 6px;
                font-weight: normal;
                font-family: sans-serif;
            }

        </style>
        <script src="main.js"></script>

    </head>
    <body>
        <h1>Phonetic transcription tool for the Luxembourgish voices in RHVoice</h1>
        <label for="word">Word</label>
        <input type="text" id="word"><button class="shortcut" id="speak-word">Speak</button> <button class="shortcut" id="lod-search">LOD</button>
        <label for="phonetic-transcription">X-SAMPA</label>
        <input type="text" id="phonetic-transcription">
        <button class="shortcut" id="clipboard">📋</button>
        <button class="shortcut" id="clear">🗑️</button>
        <label for="voice">Voice</label>
        <select id="voice">
            <option>Mil</option>
            <option>Mia</option>
        </select>
        <audio id="audioPlayer"></audio>
        <div id="output"></div>


<div class="panel">
    <h2>Consonants</h2>
<div class="row">
<div>
    <button class="phoneme">b</button>
    <div class="desc">
        <button class="example" lang="lb" data-url=""><b>B</b>eeler</button>
    </div>
</div>
<div>
    <button class="phoneme">d</button>
    <div class="desc"><button class="example" lang="lb"><b>d</b>eenen</button></div>
</div>
<div>
    <button class="phoneme">D<span class="ipa-reminder">ð</span></button>
    <div class="desc"></div>
</div>
<div>
    <button class="phoneme">d_Z<span class="ipa-reminder">d͡ʒ</span></button>
    <div class="desc"><button class="example" lang="lb"><b>J</b>eans</button><br><button class="example" lang="lb"><b>Dsch</b>ibuti</button><br><button class="example" lang="lb">A<b>dj</b>ektiv</button></div>
</div>
<div>  
    <button class="phoneme">dz</button>
    <div class="desc"><button class="example" lang="lb">spa<b>ds</b>éieren</button></div>
</div>
<div> 
    <button class="phoneme">f</button>
    <div class="desc"><button class="example" lang="lb"><b>f</b>eelen</button></div>
</div>
<div>
    <button class="phoneme">g</button>
    <div class="desc"><button class="example" lang="lb"><b>g</b>e<b>g</b>ranzt</button></div>
</div>
<div> 
    <button class="phoneme">h</button>
    <div class="desc"><button class="example" lang="lb"><b>h</b>eelen</button><br><button class="example" lang="lb">do<b>h</b>eem</button></div>
</div>
<div>
    <button class="phoneme">j</button> 
    <div class="desc"><button class="example" lang="lb"><b>J</b>emen</button><br><button class="example" lang="lb">t<b>j</b>a</button><br><button class="example" lang="lb">Lëtzebuer<b>g</b>esch</button></div>
</div>
<div>
    <button class="phoneme">k</button>
    <div class="desc"><button class="example" lang="lb"><b>K</b>eelen</button><br><button class="example" lang="lb">se<b>ch</b>s</button></div>
</div>
<div> 
    <button class="phoneme">l</button>
    <div class="desc"><button class="example" lang="lb"><b>L</b>eetem</button><br><button class="example" lang="lb">k<b>l</b>eesper</button></div>
</div>
<div> 
    <button class="phoneme">m</button>
    <div class="desc"><button class="example" lang="lb"><b>m</b>eeschten</button></div>
</div>
<div> 
    <button class="phoneme">n</button>
    <div class="desc"><button class="example" lang="lb">o<b>n</b>ee<b>n</b>s</button></div>
</div>
<div> 
    <button class="phoneme">N<span class="ipa-reminder">ŋ</span></button>
    <div class="desc"><button class="example" lang="lb">de<b>ng</b>en</button></div>
</div>
<div> 
    <button class="phoneme">p</button>
    <div class="desc"><button class="example" lang="lb"><b>p</b>ii<b>p</b>seg</button><br><button class="example" lang="lb">o<b>b</b></button></div>
</div>
<div> 
    <button class="phoneme">R<span class="ipa-reminder">ʁ</span></button>
    <div class="desc"><button class="example" lang="lb">da<b>g</b>siwwer</button></div>
</div>
<div> 
    <button class="phoneme">R\<span class="ipa-reminder">ʀ</span></button>
    <div class="desc"><button class="example" lang="lb"><b>r</b>eeneg</button><br><button class="example" lang="lb">Comptoi<b>r</b></button></div>
</div>
<div> 
    <button class="phoneme">s</button>
    <div class="desc"><button class="example" lang="lb">ru<b>ss</b>esch</button><br><button class="example" lang="lb">hai<b>s</b>lech</button></div>
</div>
<div> 
    <button class="phoneme">S<span class="ipa-reminder">ʃ</span></button>
    <div class="desc"><button class="example" lang="lb"><b>Sch</b>eedgen</button><br><button class="example" lang="lb"><b>s</b>tréieg</button></div>
</div>
<div> 
    <button class="phoneme">s\<span class="ipa-reminder">ɕ</span></button>
    <div class="desc"><button class="example" lang="lb">Ee<b>ch</b>en</button><br><button class="example" lang="lb">bewee<b>g</b>le<b>ch</b></button></div>
</div>
<div> 
    <button class="phoneme">t</button>
    <div class="desc"><button class="example" lang="lb"><b>T</b>ënten</button><br><button class="example" lang="lb">fa<b>d</b></button></div>
</div>
<div> 
    <button class="phoneme">T<span class="ipa-reminder">θ</span></button>
    <div class="desc"><button class="example" lang="lb">wi<b>th</b></button></div>
</div>
<div> 
    <button class="phoneme">t_s<span class="ipa-reminder">t͡s</span></button>
    <div class="desc"><button class="example" lang="lb"><b>Z</b>ënsen</button></div>
</div>
<div> 
    <button class="phoneme">v</button>
    <div class="desc"><button class="example" lang="lb"><b>w</b>oubäi</button></div>
</div>
<div> 
    <button class="phoneme">w</button>
    <div class="desc"><button class="example" lang="lb">z<b>w</b>ee</button><br><button class="example" lang="lb">q<b>u</b>eesch</button></div>
</div>
<div> 
    <button class="phoneme">x</button>
    <div class="desc"><button class="example" lang="lb">Ku<b>ch</b>en</button><br><button class="example" lang="lb">Da<b>g</b></button></div>
</div>
<div> 
    <button class="phoneme">z</button>
    <div class="desc"><button class="example" lang="lb"><b>S</b>ummer</button></div>
</div>
<div> 
    <button class="phoneme">Z<span class="ipa-reminder">ʒ</span></button>
    <div class="desc"><button class="example" lang="lb"><b>J</b>uli</button><br><button class="example" lang="lb">le<b>g</b>endär</button></div>
</div>
<div>  
    <button class="phoneme">z\<span class="ipa-reminder">ʑ</span></button>
    <div class="desc"><button class="example" lang="lb">déi<b>j</b>éineg</button><br><button class="example" lang="lb">ree<b>g</b>elrecht</button></div>
</div>
</div>
</div>
<div class="panel">
    <h2>Vowels</h2>
<div class="row">
<div>
    <button class="phoneme">A<span class="ipa-reminder">ɑ</span></button>
    <div class="desc"><button class="example" lang="lb">h<b>a</b>fteg</button><br><button class="example" lang="lb">K<b>a</b>ch</button></div>
</div>
<div>
    <button class="phoneme">a:</button>
    <div class="desc"><button class="example" lang="lb">H<b>aa</b>ssel</button><br><button class="example" lang="lb">K<b>a</b>p</button></div>
</div>
<div>
    <button class="phoneme">a~<span class="ipa-reminder">ã</span></button> 
    <div class="desc"><button class="example" lang="lb">Ch<b>an</b>ce</button></div>
</div>
<div>
    <button class="phoneme">{<span class="ipa-reminder">æ</span></button>
    <div class="desc"><button class="example" lang="lb">H<b>e</b>lzen</button><br><button class="example" lang="lb"><b>e</b>ng</button><br><button class="example" lang="lb">H<b>ä</b>ff</button></div>
</div>
<div>
    <button class="phoneme">@<span class="ipa-reminder">ə</span></button>
    <div class="desc"><button class="example" lang="lb">H<b>ë</b>lzer</button><br><button class="example" lang="lb">Drog<b>e</b>n</button></div>
</div>
<div>
    <button class="phoneme">6<span class="ipa-reminder">ɐ</span></button>
    <div class="desc"><button class="example" lang="lb">sau<b>er</b></button></div>
</div>
<div>
    <button class="phoneme">e</button>
    <div class="desc"><button class="example" lang="lb">Br<b>é</b>cken</button><br><button class="example" lang="lb">n<b>é</b>ng</button></div>
</div>
<div> 
    <button class="phoneme">E:<span class="ipa-reminder">ɛː</span></button>
    <div class="desc"><button class="example" lang="lb"><b>ä</b>r</button><br><button class="example" lang="lb">n<b>ä</b>mlech</button></div>
</div>
<div>
    <button class="phoneme">e:</button> 
    <div class="desc"><button class="example" lang="lb">h<b>ee</b>feg</button><br><button class="example" lang="lb">K<b>ee</b>ser</button></div>
</div>
<div>
    <button class="phoneme">E~<span class="ipa-reminder">ɛ̃</span></button>
    <div class="desc"><button class="example" lang="lb">D<b>in</b>de</button></div>
</div>
<div>
    <button class="phoneme">i</button>
    <div class="desc"><button class="example" lang="lb">h<b>i</b>wweleg</button></div>
</div>
<div> 
    <button class="phoneme">i:</button>
    <div class="desc"><button class="example" lang="lb">s<b>i</b>wen</button><br><button class="example" lang="lb">helll<b>ii</b>cht</button></div>
</div>
<div>

<div>

<div>

<div>

    <div class="desc"><button class="example" lang="lb">h<b>u</b>sch</button></div>
</div>
<div> 
    <button class="phoneme">u:</button>
    <div class="desc"><button class="example" lang="lb">T<b>u</b>t</button><br><button class="example" lang="lb">k<b>uu</b>schteg</button></div>
</div>
<div>
    <button class="phoneme">y</button>
    <div class="desc"><button class="example" lang="lb"><b>ü</b>ppeg</button></div>
</div>
</div>
</div>
<div class="panel">
<h2>Diphtongs</h2>
<div class="row">
<div>

</div>
<div>
    <button class="phoneme">AI<span class="ipa-reminder">ɑɪ</span></button>
    <div class="desc"><button class="example" lang="lb">h<b>ai</b>teg</button></div>
</div>
<div>
    <button class="phoneme">AU<span class="ipa-reminder">ɑʊ</span></button>

<div>

<div>

</div>
<div> 
    <button class="phoneme">i@<span class="ipa-reminder">iə</span></button>
    <div class="desc"><button class="example" lang="lb">H<b>ie</b>lem</button><br><button class="example" lang="lb">B<b>ier</b>gem</button></div>
</div>
<div> 
    <button class="phoneme">6_k<span class="ipa-reminder">ɐ̰</span></button>
    <div class="desc"><button class="example" lang="lb">Xav<b>ier</b></button></div>
</div>
<div>
    <button class="phoneme">oI<span class="ipa-reminder">oɪ</span></button>
    <div class="desc"><button class="example" lang="lb">Abent<b>eu</b>er</button></div>
</div>
<div> 
    <button class="phoneme">oU<span class="ipa-reminder">oʊ</span></button>
    <div class="desc"><button class="example" lang="lb">h<b>ou</b>er</button><br><button class="example" lang="lb">d<b>ou</b>dvoll</button></div>
</div>
<div>

</div>
</div>
